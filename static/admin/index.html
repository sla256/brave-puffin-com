<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Comments moderation</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    h1 { font-size: 1.4rem; }
    button { font: inherit; padding: 0.35rem 0.7rem; border: 1px solid currentColor; border-radius: 4px; background: transparent; color: inherit; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    .row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin: 1rem 0; }
    .c { padding: 0.75rem 0; border-bottom: 1px solid rgba(128,128,128,0.25); }
    .c-head { display: flex; justify-content: space-between; gap: 1rem; font-size: 0.85rem; opacity: 0.75; }
    .c-name { font-weight: 600; opacity: 1; }
    .c-body { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0.35rem 0; }
    .c-actions { display: flex; gap: 0.5rem; }
    .reply-form { margin: 0.75rem 0; }
    .reply-form label { display: block; font-weight: 600; }
    .reply-form textarea { display: block; box-sizing: border-box; width: 100%; min-height: 7rem; margin: 0.5rem 0; padding: 0.5rem; font: inherit; color: inherit; background: transparent; border: 1px solid currentColor; border-radius: 4px; resize: vertical; }
    .c-reply { margin-left: 1rem; border-left: 2px solid rgba(128,128,128,0.35); padding-left: 0.75rem; }
    .muted { opacity: 0.7; }
    [hidden] { display: none !important; } /* must beat .row's display:flex */
    .switch { padding: 0.6rem 0.8rem; border: 1px solid rgba(128,128,128,0.4); border-radius: 6px; }
    .switch.off { border-color: #c0392b; }
    .tag { font-size: 0.75rem; border: 1px solid currentColor; border-radius: 999px; padding: 0 0.5rem; }
  </style>
</head>
<body>
  <h1>Comments moderation</h1>
  <div id="auth" class="row"><button id="signin">Sign in</button></div>
  <div id="app" hidden>
    <div class="row switch" id="switch">
      <span>Posting new comments: <strong id="posting-state">…</strong></span>
      <button id="posting-toggle" disabled>…</button>
    </div>
    <div class="row">
      <label>View:
        <select id="status">
          <option value="approved">Live</option>
          <option value="removed">Hidden</option>
        </select>
      </label>
      <button id="refresh">Refresh</button>
      <button id="signout">Sign out</button>
      <span id="msg" class="muted" role="status"></span>
    </div>
    <div id="list"></div>
  </div>

  <script>
  (function () {
    "use strict";
    // Public config (non-secret): from the comments backend deploy outputs.
    var CFG = {
      apiBase: "https://api.bravepuffin.com",
      cognitoDomain: "bravepuffin-com-comments.auth.us-east-2.amazoncognito.com",
      clientId: "4b96t5q9q4440srrdofeqcks1o",
      scope: "openid email"
    };
    var redirectUri = window.location.origin + "/admin/";
    var TOKEN_KEY = "bp_admin_access_token";

    var authEl = document.getElementById("auth");
    var appEl = document.getElementById("app");
    var listEl = document.getElementById("list");
    var msgEl = document.getElementById("msg");
    var statusEl = document.getElementById("status");

    function b64url(bytes) {
      var s = btoa(String.fromCharCode.apply(null, new Uint8Array(bytes)));
      return s.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }
    function randomVerifier() {
      var a = new Uint8Array(48); crypto.getRandomValues(a); return b64url(a);
    }
    function challenge(verifier) {
      return crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)).then(b64url);
    }

    function login() {
      var verifier = randomVerifier();
      sessionStorage.setItem("bp_pkce_verifier", verifier);
      challenge(verifier).then(function (chal) {
        var url = "https://" + CFG.cognitoDomain + "/oauth2/authorize"
          + "?response_type=code&client_id=" + encodeURIComponent(CFG.clientId)
          + "&redirect_uri=" + encodeURIComponent(redirectUri)
          + "&scope=" + encodeURIComponent(CFG.scope)
          + "&code_challenge_method=S256&code_challenge=" + chal;
        window.location.assign(url);
      });
    }

    function exchangeCode(code) {
      var verifier = sessionStorage.getItem("bp_pkce_verifier") || "";
      var body = new URLSearchParams({
        grant_type: "authorization_code",
        client_id: CFG.clientId,
        code: code,
        redirect_uri: redirectUri,
        code_verifier: verifier
      });
      return fetch("https://" + CFG.cognitoDomain + "/oauth2/token", {
        method: "POST",
        headers: { "content-type": "application/x-www-form-urlencoded" },
        body: body.toString()
      }).then(function (r) {
        if (!r.ok) throw new Error("token exchange failed");
        return r.json();
      }).then(function (tok) {
        sessionStorage.setItem(TOKEN_KEY, tok.access_token);
        sessionStorage.removeItem("bp_pkce_verifier");
        history.replaceState({}, "", redirectUri); // strip ?code from the URL
      });
    }

    function token() { return sessionStorage.getItem(TOKEN_KEY); }
    function signOut() { sessionStorage.removeItem(TOKEN_KEY); show(); }

    function api(method, path, body) {
      var headers = { "authorization": "Bearer " + token() };
      if (body !== undefined) headers["content-type"] = "application/json";
      return fetch(CFG.apiBase + path, {
        method: method,
        headers: headers,
        body: body === undefined ? undefined : JSON.stringify(body)
      }).then(function (r) {
        if (r.status === 401) { signOut(); throw new Error("session expired — sign in again"); }
        if (!r.ok) return r.json().catch(function(){return {};}).then(function (d) { throw new Error(d.error || ("HTTP " + r.status)); });
        return r.json().catch(function () { return {}; });
      });
    }

    function fmt(iso) { try { return new Date(iso).toLocaleString(); } catch (e) { return iso; } }

    var replyDrafts = new Map();

    function replyForm(c, actions) {
      var draft = replyDrafts.get(c.id);
      if (!draft) { draft = { body: "", uuid: crypto.randomUUID(), open: false }; replyDrafts.set(c.id, draft); }
      var form = document.createElement("form"); form.className = "reply-form"; form.hidden = !draft.open;
      var label = document.createElement("label"); label.textContent = "Your reply (shown with an Author badge)";
      var input = document.createElement("textarea"); input.maxLength = 3000; input.required = true;
      input.value = draft.body; label.appendChild(input); form.appendChild(label);
      input.addEventListener("input", function () { draft.body = input.value; });
      var send = document.createElement("button"); send.type = "submit"; send.textContent = "Publish reply";
      var cancel = document.createElement("button"); cancel.type = "button"; cancel.textContent = "Cancel";
      var row = document.createElement("div"); row.className = "row"; row.appendChild(send); row.appendChild(cancel); form.appendChild(row);
      var message = document.createElement("p"); message.setAttribute("role", "status"); form.appendChild(message);
      var open = document.createElement("button"); open.type = "button"; open.textContent = "Reply";
      open.setAttribute("aria-expanded", String(draft.open));
      open.addEventListener("click", function () { draft.open = true; form.hidden = false; open.setAttribute("aria-expanded", "true"); input.focus(); });
      cancel.addEventListener("click", function () { draft.open = false; form.hidden = true; open.setAttribute("aria-expanded", "false"); open.focus(); });
      actions.appendChild(open);
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (send.disabled || !input.value.trim()) return;
        draft.body = input.value;
        send.disabled = true; cancel.disabled = true; input.disabled = true;
        message.textContent = "Publishing…";
        api("POST", "/admin/comments/" + c.id + "/reply", {body: draft.body, submission_uuid: draft.uuid})
          .then(function () {
            draft.body = ""; draft.uuid = crypto.randomUUID(); draft.open = false;
            input.value = ""; message.textContent = ""; form.hidden = true; open.setAttribute("aria-expanded", "false");
            loadList();
          })
          .catch(function (e) { message.textContent = "Could not publish: " + e.message; })
          .then(function () { send.disabled = false; cancel.disabled = false; input.disabled = false; });
      });
      return form;
    }

    function render(comments) {
      listEl.innerHTML = "";
      if (!comments.length) { listEl.innerHTML = '<p class="muted">Nothing here.</p>'; return; }
      var ordered = [];
      comments.filter(function (c) { return !c.parent_id; }).forEach(function (c) {
        ordered.push(c);
        comments.filter(function (r) { return r.parent_id === c.id; }).forEach(function (r) { ordered.push(r); });
      });
      comments.filter(function (c) { return c.parent_id && !comments.some(function (p) { return p.id === c.parent_id; }); }).forEach(function (c) { ordered.push(c); });
      ordered.forEach(function (c) {
        var el = document.createElement("div"); el.className = c.parent_id ? "c c-reply" : "c";
        el.id = "comment-" + c.id;
        var head = document.createElement("div"); head.className = "c-head";
        var name = document.createElement("span"); name.className = "c-name"; name.textContent = c.author_name;
        if (c.is_owner === true) {
          var badge = document.createElement("span"); badge.className = "tag"; badge.textContent = "Author";
          name.appendChild(document.createTextNode(" ")); name.appendChild(badge);
        }
        var meta = document.createElement("span"); meta.textContent = "[" + c.post_id + "] " + fmt(c.created_at);
        head.appendChild(name); head.appendChild(meta);
        var body = document.createElement("div"); body.className = "c-body"; body.textContent = c.body;
        var actions = document.createElement("div"); actions.className = "c-actions";
        if (c.status === "approved") actions.appendChild(actionBtn("Hide", "Hidden", "POST", "/admin/comments/" + c.id + "/remove"));
        if (c.status === "removed") actions.appendChild(actionBtn("Restore", "Restored", "POST", "/admin/comments/" + c.id + "/restore"));
        actions.appendChild(actionBtn("Delete", "Deleted", "DELETE", "/admin/comments/" + c.id, true));
        el.appendChild(head); el.appendChild(body); el.appendChild(actions);
        if (c.parent_id) {
          var context = document.createElement("p"); context.className = "muted";
          var parent = comments.find(function (p) { return p.id === c.parent_id; });
          context.textContent = parent ? "Reply to " + parent.author_name : "Reply to a comment outside this view. Visible publicly only while the original comment is live.";
          el.insertBefore(context, body);
        }
        if (c.status === "approved") el.appendChild(replyForm(c, actions));
        listEl.appendChild(el);
      });
    }

    function actionBtn(label, doneText, method, path, confirmFirst) {
      var b = document.createElement("button");
      b.textContent = label;
      b.addEventListener("click", function () {
        if (confirmFirst && !window.confirm("Permanently delete this comment?")) return;
        b.disabled = true; msgEl.textContent = label + "…";
        api(method, path).then(function () { msgEl.textContent = doneText + "."; loadList(); })
          .catch(function (e) { msgEl.textContent = e.message; b.disabled = false; });
      });
      return b;
    }

    // Site-wide posting switch (settings table). The public side caches it ~30 s.
    var postingEnabled = null;
    var switchEl = document.getElementById("switch");
    var postingStateEl = document.getElementById("posting-state");
    var postingBtn = document.getElementById("posting-toggle");

    function renderPosting(enabled) {
      postingEnabled = enabled;
      postingStateEl.textContent = enabled ? "ON" : "OFF (comments closed site-wide)";
      postingBtn.textContent = enabled ? "Turn off" : "Turn on";
      switchEl.classList.toggle("off", !enabled);
      postingBtn.disabled = false;
    }

    function loadSettings() {
      api("GET", "/admin/settings")
        .then(function (d) { renderPosting(d.posting_enabled !== false); })
        .catch(function (e) { postingStateEl.textContent = "unknown (" + e.message + ")"; });
    }

    postingBtn.addEventListener("click", function () {
      var next = !postingEnabled;
      if (!next && !window.confirm("Close commenting on the whole site? Existing comments stay visible.")) return;
      postingBtn.disabled = true;
      api("POST", "/admin/settings", { posting_enabled: next })
        .then(function (d) {
          renderPosting(d.posting_enabled);
          msgEl.textContent = "Posting turned " + (d.posting_enabled ? "on" : "off") + " (takes up to 30 s).";
        })
        .catch(function (e) { msgEl.textContent = e.message; postingBtn.disabled = false; });
    });

    function loadList() {
      msgEl.textContent = "Loading…";
      api("GET", "/admin/comments?status=" + statusEl.value)
        .then(function (d) { render(d.comments || []); msgEl.textContent = ""; })
        .catch(function (e) { msgEl.textContent = e.message; });
    }

    function show() {
      var authed = !!token();
      authEl.hidden = authed;
      appEl.hidden = !authed;
      if (authed) { loadSettings(); loadList(); }
    }

    document.getElementById("signin").addEventListener("click", login);
    document.getElementById("signout").addEventListener("click", signOut);
    document.getElementById("refresh").addEventListener("click", loadList);
    statusEl.addEventListener("change", loadList);

    var code = new URLSearchParams(window.location.search).get("code");
    if (code) {
      exchangeCode(code).then(show).catch(function (e) { msgEl.textContent = e.message; show(); });
    } else {
      show();
    }
  })();
  </script>
</body>
</html>
